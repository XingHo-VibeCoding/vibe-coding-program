<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>接口检查台 · Day 22</title>
<style>
  /* 设计令牌沿用index.html / concept.html 的同一套（PRD §5.5） */
  :root {
    --accent: #2f6fed;
    --accent-text: #2560d8;
    --bg: #ffffff;
    --fg: #1f2328;
    --fg-muted: #5b6570;
    --line: #e3e7ec;
    --danger: #c0392b;
    --danger-text: #a5281a;
    --ok: #1a7f4b;
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: var(--sp-6);
    background: var(--bg); color: var(--fg);
    font: 16px/1.7 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 var(--sp-2); }
  .sub { color: var(--fg-muted); font-size: 14px; margin-bottom: var(--sp-6); }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: var(--sp-5); margin-bottom: var(--sp-5);
  }
  .card h2 { font-size: 17px; margin: 0 0 var(--sp-3); }
  .row { display: flex; gap: var(--sp-3); align-items: flex-start; flex-wrap: wrap; }
  .grow { flex: 1 1 220px; min-width: 0; }
  input[type=text] {
    width: 100%; padding: 9px 12px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 6px; font-family: inherit;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 9px 16px; font-size: 14px; font-family: inherit; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 6px;
    background: var(--accent); color: #fff;
  }
  button:hover { background: #2559c9; border-color: #2559c9; }
  button.ghost { background: #fff; color: var(--accent-text); }
  button.ghost:hover { background: #eef3fe; border-color: var(--accent); }
  button.danger { background: #fff; color: var(--danger-text); border-color: #e3b8b2; }
  button.danger:hover { background: #fdf1ef; border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: var(--sp-3) var(--sp-2); border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--fg-muted); font-weight: 600; font-size: 13px; }
  td.id { font-family: ui-monospace, Consolas, monospace; color: var(--fg-muted); }
  /* 状态区：一眼能看出这次操作到底成没成 */
  .status { margin-top: var(--sp-3); padding: var(--sp-3); border-radius: 6px; font-size: 14px; display: none; }
  .status.show { display: block; }
  .status.ok { background: #eaf6ef; color: var(--ok); }
  .status.err { background: #fdf1ef; color: var(--danger-text); }
  .status code { font-family: ui-monospace, Consolas, monospace; }
  /* 二次确认对话框（清单硬要求：删除前必须确认） */
  .mask {
    display: none; position: fixed; inset: 0; z-index: 9;
    background: rgba(20,24,30,.45); align-items: center; justify-content: center; padding: var(--sp-4);
  }
  .mask.show { display: flex; }
  .dialog {
    background: #fff; border-radius: var(--radius); padding: var(--sp-6);
    max-width: 420px; width: 100%;
  }
  .dialog h3 { margin: 0 0 var(--sp-3); font-size: 17px; }
  .dialog p { margin: 0 0 var(--sp-5); color: var(--fg-muted); font-size: 14px; }
  .dialog .acts { display: flex; gap: var(--sp-3); justify-content: flex-end; }
  .tip { font-size: 13px; color: var(--fg-muted); margin-top: var(--sp-3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>接口检查台</h1>
  <p class="sub">
    Day 22 · 用于对 <code>PATCH /api/favorites/{id}</code> 与 <code>DELETE /api/favorites/{id}</code>
    做真实操作。数据直接落在云数据库，不是内存假象。
  </p>

  <!-- 改备注 -->
  <div class="card">
    <h2>① 改备注（PATCH）</h2>
    <div class="row">
      <div class="grow"><input type="text" id="patchId" placeholder="收藏 id，例如 14" /></div>
      <div class="grow"><input type="text" id="patchNote" placeholder="新备注，例如 测试-改" /></div>
      <button id="btnPatch">保存修改</button>
    </div>
    <div class="status" id="patchStatus"></div>
    <p class="tip">只允许改备注。填其他字段会被接口拒掉（这是有意的防呆）。</p>
  </div>

  <!-- 删一条 -->
  <div class="card">
    <h2>② 删一条（DELETE）</h2>
    <div class="row">
      <div class="grow"><input type="text" id="delId" placeholder="收藏 id，例如 18" /></div>
      <button class="danger" id="btnDel">删除这条收藏</button>
    </div>
    <div class="status" id="delStatus"></div>
    <p class="tip">删除不可撤销，点下去会先弹确认框。</p>
  </div>

  <!-- 收藏列表 -->
  <div class="card">
    <h2>③ 当前收藏（GET 读回）</h2>
    <div class="row" style="margin-bottom:var(--sp-3)">
      <button class="ghost" id="btnReload">刷新列表</button>
    </div>
    <table>
      <thead><tr><th>id</th><th>概念</th><th>备注</th><th>收藏时间</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" style="color:var(--fg-muted)">读取中…</td></tr></tbody>
    </table>
    <div class="status" id="listStatus"></div>
  </div>
</div>

<!-- 二次确认对话框 -->
<div class="mask" id="mask">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h3 id="dlgTitle">确认删除这条收藏？</h3>
    <p id="dlgBody">删除后不可恢复。</p>
    <div class="acts">
      <button class="ghost" id="btnCancel">取消</button>
      <button class="danger" id="btnConfirm">确认删除</button>
    </div>
  </div>
</div>

<script>
// API 基址与concepts.js 保持同一处口径
var API_BASE = 'https://ai-concept-daily-d2ex3o18b05e6dd-1498895639.ap-shanghai.app.tcloudbase.com';

// ==========================================================================
// Day 23 新增：错误三分类 + HTML 转义 + 输入校验
//
// 为什么加：Day 22 版本把后端的 error.code 原样印在页面上（如
// <code>PATCH_FIELD_NOT_ALLOWED</code>），把「请求没能送达接口」的 err
// 整个丢掉。这两处都不是给人看的 —— 前者是工程术语，后者让线上排障
// 毫无线索。本节按「用户输入错 / 网络接口错 / 服务端错」三类统一出口。
// ==========================================================================

/** ① HTML 转义：数据库里的 note 是用户自己写进去的，直接 innerHTML 会执行脚本 */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/**
 * 错误码 → 分类。三类的处置口径固定不变：
 *   input   用户输入错 → 告诉他**改什么**（能自己解决）
 *   net     网络/接口错 → 提示**稍后再试**（不是他的错）
 *   server  服务端错 → **console 记日志** + 通用提示（我们的错，不该让他看细节）
 */
var ERR_KIND = {
  MISSING_SLUG: 'input', CONCEPT_NOT_FOUND: 'input',
  MISSING_FIELD: 'input', INVALID_FIELD: 'input',
  NOTE_TOO_LONG: 'input', SLUG_TOO_LONG: 'input',
  MISSING_NOTE: 'input', PATCH_INVALID_FIELD: 'input', PATCH_FIELD_NOT_ALLOWED: 'input',
  INVALID_ID: 'input', DUPLICATE_FAVORITE: 'input',
  FAVORITE_NOT_FOUND: 'input',
  DB_UNAVAILABLE: 'net',
  NOT_FOUND: 'net',
  INTERNAL_ERROR: 'server'
};

/** 兜底文案：后端没给 code、或 code 不在表里时，按 HTTP 状态猜类别 */
function kindOf(code, httpStatus) {
  if (code && ERR_KIND[code]) return ERR_KIND[code];
  /* status 为 0 表示请求根本没送达（断网 / DNS / 跨域被拦）——
     这是**网络错**，不是服务端错。Day 23 首轮截图实测发现的分类错误：
     从 file:// 打开本页时列表加载失败，被误显示成「服务出错了」。 */
  if (!httpStatus) return 'net';
  if (httpStatus === 400 || httpStatus === 409) return 'input';
  if (httpStatus === 404 || httpStatus === 502 || httpStatus === 503 || httpStatus === 504) return 'net';
  return 'server';
}

/** 三类各自的收尾话术。userMsg 是后端给的中文人话，优先用它（它最贴场景） */
var KIND_TIP = {
  input: '',
  net: '这是网络或接口的问题，不用改你填的内容，等一会儿再试一次就行。',
  server: '这是我们这边的问题，已经记下日志了。请稍后再试。'
};

/**
 * 唯一错误出口：把后端信封 / fetch 异常统一转成「分类 + 中文提示」。
 * @param {string} code后端错误码（可能为空）
 * @param {number} status HTTP 状态码（可能为 0，表示请求没送达）
 * @param {string} userMsg 后端给的中文 message
 * @param {Error} [rawErr] 原始异常，只进 console，不进提示
 */
function presentError(code, status, userMsg, rawErr) {
  var kind = kindOf(code, status);
  var text = (userMsg || '').trim();
  /* 输入错：后端的话就是「改什么」，直接用，不加尾巴让它更长。
     另外两类要补一句「接下来怎么办」，否则用户只看到失败、不知道怎么办。*/
  if (kind !== 'input') {
    text = text ? text + ' ' + KIND_TIP[kind] : KIND_TIP[kind];
  }
  /* 服务端错：细节只进日志，绝不进提示（api-contract §2 纪律） */
  if (kind === 'server') {
    console.error('[console] 服务端错误 code=' + (code || '无') + ' http=' + status, rawErr || '');
  }
  return { kind: kind, code: code || '', text: text };
}

function showStatus(el, ok, html) {
  el.className = 'status show ' + (ok ? 'ok' : 'err');
  el.innerHTML = html;
}

/** 失败提示的统一渲染：正文走 esc()，只有我们自己写的分类标签用标签呈现 */
function showError(el, p) {
  var label = { input: '需要你改一下', net: '网络/接口问题', server: '服务出错了' }[p.kind];
  showStatus(el, false,
    '<strong>' + esc(label) + '</strong>　' + esc(p.text) +
    (p.code ? '　<span class="tip">（技术码 ' + esc(p.code) + '，排查用）</span>' : '')
  );
}

/** fetch 的网络层失败（断网/ DNS / 跨域被拦）：一律归「网络/接口错」 */
function onNetFail(el, err) {
  console.warn('[console] 请求未送达接口', err);
  showError(el, presentError('', 0, '', err));
}

/**
 * 统一发请求：拆信封 → 成功走onOk，失败走 showError。
 * 这里不直接用 r.json()：网关返回 HTML 错误页时它会抛 SyntaxError，
 * 那种情况要算「服务端错」，不能混进「网络错」。
 */
function callApi(el, url, opts, onOk) {
  fetch(url, opts)
    .then(function (r) {
      return r.text().then(function (t) {
        var body = null;
        try { body = t ? JSON.parse(t) : null; }
        catch (e) {
          showError(el, presentError('BAD_GATEWAY', r.status, '接口没有返回正常内容，稍后再试一次。', e));
          return;
        }
        if (!body || body.ok !== true) {
          /* Day 23 审计发现：**网关层错误不走云函数**，信封形状和我们的
             契约不一样 —— 是 { code:"INVALID_PATH", message:"Invalid path.
             For more information, please refer to https://docs..." }，
             全英文、还带一个文档链接。绝不能原样显示给使用者。
             这里认出这种形状，换成中文「接口地址不存在」。 */
          if (body && !body.ok && body.code && body.message && !body.error) {
            console.warn('[console] 网关层错误（非云函数返回）：', body);
            showError(el, presentError('GW_' + body.code, r.status, '接口地址不存在，请检查访问的地址是否正确。'));
            return;
          }
          var code = (body && body.error && body.error.code) || ('HTTP_' + r.status);
          var msg = (body && body.error && body.error.message) || '';
          showError(el, presentError(code, r.status, msg));
          return;
        }
        onOk(body.data);
      });
    })
    .catch(function (err) { onNetFail(el, err); });
}

/* ---------- 本地输入校验：把「用户输入错」拦在请求之前 ---------- */
var MAX_NOTE_LEN = 200;   /* 与后端 createFavorite / updateFavorite 的上限一致 */

/** 收藏 id 必须是正整数。返回 null 表示通过，否则返回该报的中文提示 */
function checkId(raw) {
  var v = String(raw === null || raw === undefined ? '' : raw).trim();
  if (v === '') return '请先填写收藏 id（就是列表里那一行的编号）。';
  if (!/^\d+$/.test(v)) return '收藏 id 只能是数字，例如 14。请把列表里的编号原样填进来。';
  if (Number(v) <= 0) return '收藏 id 要是大于 0 的数字。';
  return null;
}

// ---------- ① PATCH ----------
document.getElementById('btnPatch').addEventListener('click', function () {
  var el = document.getElementById('patchStatus');
  var id = document.getElementById('patchId').value.trim();
  var note = document.getElementById('patchNote').value;

  var bad = checkId(id);
  if (bad) { showError(el, presentError('INVALID_ID', 0, bad)); return; }
  if (note.length > MAX_NOTE_LEN) {
    showError(el, presentError('NOTE_TOO_LONG', 0, '备注最多 ' + MAX_NOTE_LEN + ' 字，现在有 ' + note.length + ' 字，删掉一点再保存。'));
    return;
  }

  callApi(el, API_BASE + '/api/favorites/' + encodeURIComponent(id), {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ note: note })
  }, function (d) {
    showStatus(el, true, '修改成功：id ' + esc(d.id) + '（' + esc(d.slug) + '）备注已改为「' + esc(d.note === null ? '空' : d.note) + '」');
    loadList();
  });
});

// ---------- ② DELETE（带二次确认）----------
var pendingId = null;
var mask = document.getElementById('mask');

document.getElementById('btnDel').addEventListener('click', function () {
  var id = document.getElementById('delId').value.trim();
  var bad = checkId(id);
  /* 空id / 非数字 id 在这里就被拦下并说清「改什么」，
     不会再像Day 22 那样发出去后被后端回一句「接口不存在」。 */
  if (bad) {
    showError(document.getElementById('delStatus'), presentError('INVALID_ID', 0, bad));
    return;
  }
  pendingId = id;
  document.getElementById('dlgBody').textContent = '即将删除 id = ' + id + ' 的收藏。删除后不可恢复。';
  mask.classList.add('show');
});
document.getElementById('btnCancel').addEventListener('click', function () {
  mask.classList.remove('show');
  pendingId = null;
});
document.getElementById('btnConfirm').addEventListener('click', function () {
  mask.classList.remove('show');
  var el = document.getElementById('delStatus');
  var id = pendingId;
  pendingId = null;
  if (!id) return;
  callApi(el, API_BASE + '/api/favorites/' + encodeURIComponent(id), { method: 'DELETE' }, function (d) {
    showStatus(el, true, '已删除：id ' + esc(d.id) + '（' + esc(d.slug) + '），列表里已不再出现');
    loadList();
  });
});

// ---------- ③ 列表 ----------
function loadList() {
  var tbody = document.getElementById('rows');
  var st = document.getElementById('listStatus');
  callApi(st, API_BASE + '/api/favorites', { headers: { 'Accept': 'application/json' } }, function (d) {
    var items = d.items;
    st.className = 'status';
    st.textContent = '';
    if (!items.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="color:var(--fg-muted)">还没有收藏</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function (it) {
      /* 三处用户可控字段全部转义：note 是用户写进数据库的原文，
         不转义的话在这里就是存储型 XSS（Day 23 审计 B1 项）。 */
      return '<tr>'
        + '<td class="id">' + esc(it.id) + '</td>'
        + '<td>' + esc(it.slug) + '</td>'
        + '<td>' + (it.note === null ? '<span style="color:var(--fg-muted)">（空）</span>' : esc(it.note)) + '</td>'
        + '<td class="id">' + esc(it.createdAt) + '</td>'
        + '</tr>';
    }).join('');
  });
}

document.getElementById('btnReload').addEventListener('click', loadList);
loadList();
</script>
</body>
</html>
