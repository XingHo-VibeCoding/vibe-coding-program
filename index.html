<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日一个 AI 概念详解</title>
  <meta name="description" content="用简单易懂的方式，每天讲解一个 AI 核心概念。" />
  <meta name="theme-color" content="#f6f7f9" />
  <!--
    内联 SVG 图标：不额外请求文件，顺带消掉控制台里的 /favicon.ico 404 报错。
    图标 = 强调色圆角方块 + 白色 AI 两个字。
  -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6fed'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E" />
  <style>
    /* 设计变量沿用 Day 2 占位页的口径（PRD.md §5.5）。Day 9 增量：
       ① 新增 --accent-text：与 --accent 同色系、深一档，专供「小字号强调文字」。
          原因：--accent 是为色块与边框选的中间调蓝，直接拿来写 13～18px 的文字时
          在浅灰底上只有 4.24:1、在浅蓝底上只有 3.98:1，低于 WCAG AA 正文要求的 4.5:1。
       ② 新增间距刻度：以 4px 为基数，全站间距只从这套刻度里取值，不再随手写数字。 */
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1a1d21;
      --text-soft: #5b6472;
      --line: #e4e7ec;
      --accent: #2f6fed;        /* 只用于色块 / 边框 / 按钮底，不用于小字号文字 */
      --accent-text: #2560d8;   /* 小字号强调文字专用：浅灰底 5.23:1，白卡 5.61:1 */
      --accent-soft: #eaf0fe;
      --radius: 14px;

      /* 间距刻度：4px 基数 */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-7: 32px;
      --sp-8: 40px;
      --sp-9: 56px;
      --sp-10: 80px;
    }

    * { box-sizing: border-box; }

    /* hidden 属性要能盖住下面的 flex 布局，否则隐藏不生效 */
    [hidden] { display: none !important; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: var(--sp-9) var(--sp-5) var(--sp-10);
    }

    /* ---------- 顶部：标题 + 一句话定位 ----------
       Day 9 改动：移除原来的「Day 8 · 首页主视图」徽标。它是开发进度标签，
       PRD.md §5.2 的首页层级（标题 → 定位 → 计数 → 列表）里没有它，
       却占着首屏第一行、把 h1 挤下去；同样信息页脚已有，不丢内容。
       同时把间距拉开：标题块与计数行原来只隔 24px、计数行与列表隔 18px，
       两者近似等距，读不出层级。现在改成 32px 对 16px，用亲疏表达归属。 */
    header { margin-bottom: var(--sp-7); }

    h1 {
      margin: 0 0 var(--sp-2);
      font-size: 34px;
      line-height: 1.3;
      letter-spacing: -.01em;
      overflow-wrap: anywhere; /* 长词自动折行，窄屏不撑破容器（PRD.md §7 第 10、11 项） */
    }

    .sub {
      margin: 0;
      color: var(--text-soft);
      font-size: 16px;
    }

    /* ---------- 已收录条数 + 最近更新日期 ---------- */
    /* 与标题块隔 32px、与下方列表只隔 16px —— 靠「贴住列表」表达它属于列表 */
    .count {
      margin: 0 0 var(--sp-4);
      color: var(--text-soft);
      font-size: 14px;
    }

    .count strong {
      color: var(--accent-text);
      font-size: 18px;
    }

    /* ---------- 概念卡片列表 ---------- */
    /* 卡片外层（Day 11 新增）：只干一件事 —— 给右上角的收藏按钮一个定位参考框。
       为什么要多这一层：<a>（整张卡片）里不能再套 <button>。HTML 规定交互元素
       不能互相嵌套，套了之后键盘 Tab 顺序和读屏软件的行为都会变得古怪。
       所以把按钮放到 <a> 外面，再用绝对定位压回卡片的右上角。
       好处是卡片的行数、内边距、行距一个像素都不用改。 */
    .item-wrap {
      position: relative;   /* 按钮的定位基准 = 这一层，按钮跑不出卡片范围 */
      margin-bottom: var(--sp-4);
    }

    .item {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--sp-5) var(--sp-6);
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    /* hover 高亮挪到外层：按钮盖在卡片右上角，鼠标停在按钮上时 .item 已经不在
       指针下方，:hover 不再命中，卡片会「闪一下」掉高亮。挂在外层就没这个问题。 */
    .item-wrap:hover .item {
      border-color: var(--accent);
      box-shadow: 0 2px 10px rgba(47, 111, 237, .08);
    }

    /* 键盘按 Tab 走到卡片时给一个明显的焦点环。
       :focus-visible 只在键盘操作时出现，鼠标点击不会留框，不碍眼。 */
    .item:focus-visible {
      outline: 3px solid var(--accent-text);
      outline-offset: 2px;
    }

    .item-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--sp-3);
      font-size: 13px;
      color: var(--text-soft);
      /* 给右上角的收藏按钮让位，避免日期文字钻到按钮底下。
         96px = 按钮最宽时（「★ 已收藏」）的宽度 + 一点余量。 */
      padding-right: 96px;
    }

    .item-title {
      margin: var(--sp-2) 0;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .item-title .en {
      margin-left: var(--sp-2);
      font-size: 14px;
      font-weight: 400;
      color: var(--text-soft);
    }

    .item-def {
      margin: 0;
      font-size: 15px;
      color: var(--text-soft);
    }

    /* 未写完的记录仍可见，但会带上这个标记，且不计入「已更新」条数（PRD.md §7 第 4 项） */
    .tag-todo {
      display: inline-block;
      padding: 1px var(--sp-2);
      border-radius: 999px;
      background: #fff8e6;
      border: 1px solid #f5e0a8;
      color: #7a5a12;
      font-size: 12px;
    }

    /* ---------- 卡片收藏按钮（Day 11 新增） ----------
       三个状态全部由 data-fav-state 这一个属性驱动，样式都挂在它下面：
         off      未收藏 → 空心星 + 灰字 + 描边
         on       已收藏 → 实心星 + 蓝底白字
         pending  处理中 → 转圈 + 按钮禁用
       好处：文字、图标、颜色、可点性永远同步，不会出现「文字变了样式没变」的中间态。 */
    .fav-btn {
      position: absolute;
      top: var(--sp-5);     /* 与卡片上内边距对齐，视觉上正好落在日期那一行 */
      right: var(--sp-6);
      display: inline-flex;
      align-items: center;
      gap: var(--sp-1);
      padding: var(--sp-1) var(--sp-3);
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--card);
      color: var(--text-soft);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, border-color .15s ease;
    }

    /* hover 改底色，不降低透明度 —— 用 opacity 会把文字对比度一起拉低（Day 9 的教训） */
    .fav-btn:hover {
      border-color: var(--accent-text);
      color: var(--accent-text);
      background: var(--accent-soft);
    }

    .fav-btn:focus-visible {
      outline: 3px solid var(--accent-text);
      outline-offset: 2px;
    }

    /* 已收藏：填实。底色用 --accent-text 而不是 --accent ——
       白字压在 #2f6fed 上只有 4.55:1，压在 #2560d8 上是 5.61:1，13px 小字才稳过 AA。 */
    .fav-btn[data-fav-state="on"] {
      background: var(--accent-text);
      border-color: var(--accent-text);
      color: #ffffff;
    }

    .fav-btn[data-fav-state="on"]:hover {
      background: #1d4fbf;
      border-color: #1d4fbf;
    }

    /* 处理中：置灰 + 鼠标变成「等待」图标。
       这里的 opacity 与详情页 .nav-link.is-disabled 同理 ——
       WCAG 对「非活动控件」的对比度有豁免，这是刻意为之，不是漏改。 */
    .fav-btn[data-fav-state="pending"] {
      cursor: progress;
      opacity: .7;
    }

    /* 行内元素不支持 transform，弹跳动画需要它变成 inline-block */
    .fav-icon {
      display: inline-block;
      font-size: 14px;
      line-height: 1;
    }

    /* 转圈图标：平时不占位，只有处理中才顶掉星星出现 */
    .fav-spin {
      display: none;
      width: 12px;
      height: 12px;
      border: 2px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .fav-btn[data-fav-state="pending"] .fav-icon { display: none; }
    .fav-btn[data-fav-state="pending"] .fav-spin { display: inline-block; }

    /* 收藏成功时星星弹一下。动效只是锦上添花：
       系统开了「减少动态效果」时不播，文字与颜色照样会变。 */
    .fav-btn.is-pop .fav-icon { animation: fav-pop .3s ease-out; }

    @keyframes fav-pop {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    /* ---------- 提示条：收藏失败时出现（Day 11 新增） ----------
       固定浮在页面底部，不挤动卡片布局。平时隐藏，只在出错时出现。 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: var(--sp-7);
      z-index: 10;
      max-width: min(92vw, 420px);
      padding: var(--sp-3) var(--sp-5);
      border-radius: 12px;
      background: #22262c;
      color: #ffffff;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 6px 24px rgba(16, 20, 26, .3);
      cursor: pointer;
      /* 收起时用 visibility 而不是 display，opacity 才有过渡可播 */
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(var(--sp-2));
      transition: opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
    }

    .toast.is-show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      transition: opacity .18s ease, transform .18s ease, visibility 0s;
    }

    @media (prefers-reduced-motion: reduce) {
      .fav-btn.is-pop .fav-icon { animation: none; }
      .toast { transition: none; }
    }

    /* ---------- 状态提示卡片：加载中 / 空 / 错误（PRD.md §7） ---------- */
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: var(--sp-6);
    }

    .panel-title {
      margin: 0 0 var(--sp-2);
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
    }

    .panel-desc {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    /* 「加载中」用的居中面板 + 转圈指示器 */
    .panel-center { text-align: center; }

    .panel-center .panel-desc { margin-top: var(--sp-2); }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--accent-soft);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* 系统开了「减少动态效果」时不转圈，避免不适（无障碍） */
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }

    code {
      background: #f1f3f6;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      color: #2b3440;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: var(--sp-8);
      padding-top: var(--sp-5);
      border-top: 1px solid var(--line);
      color: var(--text-soft);
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--sp-2);
    }

    /* ---------- 窄屏（≤480px）：收窄横向内边距 ----------
       原来单侧横向内边距 20px(容器) + 24px(卡片) = 44px，在 375px 屏幕上要吃掉约 23%，
       `.panel` 更是 50px，正文只剩约 275px，读起来偏挤。这里按 PRD.md §5.6
       「不做独立移动端布局，但正文不需缩放可读」收窄内边距，不改信息层级。 */
    @media (max-width: 480px) {
      .wrap { padding-left: var(--sp-4); padding-right: var(--sp-4); }
      h1 { font-size: 28px; }
      .item { padding: var(--sp-4); }
      .panel { padding: var(--sp-5); }
      /* 窄屏卡片内边距收到 16px，收藏按钮跟着往里收，保持与日期同一行 */
      .fav-btn { top: var(--sp-4); right: var(--sp-4); }
      .toast { bottom: var(--sp-5); }
    }
  </style>
</head>
<body>
  <!-- PRD.md §7 第 5 项：浏览器禁用脚本时，显示一段能读的静态说明，不白屏 -->
  <noscript>
    <div class="wrap">
      <div class="panel">
        <h2 class="panel-title">这个网站需要开启 JavaScript 才能显示内容</h2>
        <p class="panel-desc">
          本站的概念内容存在数据文件里，由浏览器读取后显示。<br />
          请开启浏览器的 JavaScript 后刷新页面；或者直接双击本目录下的 <code>index.html</code> 打开。
        </p>
      </div>
    </div>
  </noscript>

  <div class="wrap">
    <header>
      <h1>每日一个 AI 概念详解</h1>
      <p class="sub">用简单易懂的方式，每天讲清一个 AI 核心概念。</p>
    </header>

    <!-- aria-live：状态变化时让屏幕阅读器念出这句摘要，不必靠眼睛盯着页面 -->
    <p class="count" id="count" aria-live="polite">正在加载…</p>

    <!--
      概念卡片由下方脚本从这里注入；页面里不写死任何一条概念的内容（PRD.md §6.2）。
      data-state 会随当前状态变化，取值：loading / success / empty / error。
      在浏览器里按 F12，选中这个元素就能看到它现在是哪个状态。
    -->
    <main class="list" id="list" data-state="loading"></main>

    <footer>
      <span>每日一个 AI 概念详解</span>
      <span>Day 20｜首页数据来自公网接口</span>
    </footer>
  </div>

  <!-- 收藏失败时的提示条（Day 11）。固定浮在页面底部，不挤动卡片布局；
       平时隐藏，只有出错时才出现，点一下可以提前收走。 -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- 数据文件：首页只从这里读数据 -->
  <script src="concepts.js"></script>
  <script>
    (function () {
      'use strict';

      /* ==========================================================================
       * 首页主视图渲染脚本
       * --------------------------------------------------------------------------
       * 职责：从数据文件取概念 → 渲染成卡片列表。
       * 页面里不写死任何一条概念的内容（PRD.md §6.2）。
       *
       * 四种状态（本次要求，其中 3 项对应 PRD.md §7）
       *   loading  加载中  ← 正在读取数据
       *   success  成功    ← 列表渲染完成
       *   empty    空      ← 一条内容都没有（PRD.md §7 第 3 项）
       *   error    错误    ← 数据文件没加载成功（PRD.md §7 第 5 项）
       *
       * 当前状态写在 <main id="list"> 的 data-state 属性上，方便核对。
       *
       * 调试开关（只为验收用，不带参数时完全不影响正常流程）
       *   在地址后加 ?state=loading 停在「加载中」不动（Day 13 新增，为了能把这一态截到图）
       *   在地址后加 ?state=empty   强制进入空状态
       *   在地址后加 ?state=error   强制进入错误态
       *   例：http://127.0.0.1:8000/index.html?state=empty
       * ========================================================================== */

      var listEl  = document.getElementById('list');
      var countEl = document.getElementById('count');

      /* ---------- 工具：把文本里的 < > & " 转成安全字符 ----------
         概念内容里如果出现这些符号，不加这一层会把页面结构弄坏。 */
      function esc(s) {
        return String(s === null || s === undefined ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ---------- 工具：统一的提示卡片 ----------
         文案一律说人话（PRD.md §7 统一处理原则）。
         role="status" 让屏幕阅读器在提示出现时念出来，不用眼睛盯屏幕。 */
      function panel(title, desc) {
        return '<div class="panel" role="status">'
             +   '<h2 class="panel-title">' + esc(title) + '</h2>'
             +   '<p class="panel-desc">' + desc + '</p>'
             + '</div>';
      }

      /* ---------- 工具：记录当前状态 ---------- */
      function setState(state) {
        listEl.setAttribute('data-state', state);
      }

      /* ==========================================================================
       * 收藏交互（Day 11）
       * --------------------------------------------------------------------------
       * 收藏状态的做法：Day 20 起，先用 fetchFavoriteSlugs()（见 concepts.js 第四节）
       * 从数据库把已收藏的 slug 读回来填进 favState，点一下则调POST /api/favorites
       * 真的写进数据库。仍然不写浏览器存储 —— 与 PRD.md §5.7 一致，
       * 状态来源是数据库，不是 localStorage。
       *
       * 下面的防重复提交、失败回滚、失败提示这几段逻辑从 Day 11 一直没改，
       * 接真实接口后原样可用 —— 这就是当初把网络调用放在 concepts.js 的价值。
       *
       * 一张卡片上的按钮有 3 个状态（样式见上方 CSS，全部由 data-fav-state 驱动）：
       *   off      未收藏  ← 空心星 + 灰字描边
       *   on       已收藏  ← 实心星 + 蓝底白字，文字变成「已收藏」
       *   pending  处理中  ← 转圈 + 按钮禁用，此期间再点不会重复提交
       * ========================================================================== */

      var favState = {};   // slug -> true   已收藏的编号（Day 20 起：初始值来自数据库读回）
      var inFlight = {};   // slug -> true   正在等回包的编号（防重复提交的第二道闸）

      /* 提示条元素与它的收走定时器 */
      var toastEl = document.getElementById('toast');
      var toastTimer = null;

      /* ---------- 提示条：说清楚「发生了什么、下一步做什么」 ----------
         文案一律说人话，不把技术错误信息甩给用户（PRD.md §7 统一处理原则）。
         role="status" + aria-live="polite"：文字出现时读屏软件会念出来。 */
      function showToast(message) {
        if (!toastEl) return;

        toastEl.textContent = message;
        toastEl.classList.add('is-show');

        /* 连续失败时重置计时，免得上一条还没看完就被收走 */
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 4500);
      }

      function hideToast() {
        if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
        if (toastEl) toastEl.classList.remove('is-show');
      }

      if (toastEl) toastEl.addEventListener('click', hideToast);

      /* ---------- 生成一张卡片的收藏按钮 ----------
         初始状态直接从 favState 读，所以列表重新渲染后状态不会丢。 */
      function favButtonHtml(c) {
        var slug = String(c.slug);
        var name = c.titleZh || slug;
        var on = favState[slug] === true;

        return '<button type="button" class="fav-btn"'
             +   ' data-fav-state="' + (on ? 'on' : 'off') + '"'
             +   ' data-slug="' + esc(slug) + '"'
             +   ' data-title="' + esc(name) + '"'
             +   ' aria-pressed="' + (on ? 'true' : 'false') + '"'
             +   ' aria-label="' + esc((on ? '已收藏，点击取消：' : '收藏：') + name) + '">'
             +   '<span class="fav-icon" aria-hidden="true">' + (on ? '★' : '☆') + '</span>'
             +   '<span class="fav-spin" aria-hidden="true"></span>'
             +   '<span class="fav-text">' + (on ? '已收藏' : '收藏') + '</span>'
             + '</button>';
      }

      /* ---------- 把按钮画成某个状态 ----------
         这是唯一的「改按钮长相」的出口。只改这一个函数，
         文字 / 图标 / 颜色 / 可点性 / 读屏文案就一定同步。 */
      function paintFav(btn, state) {
        var slug = btn.getAttribute('data-slug') || '';
        var name = btn.getAttribute('data-title') || '这条概念';
        var on = favState[slug] === true;   // 以「已确认的状态」为准，不是以本次意图为准
        var iconEl = btn.querySelector('.fav-icon');
        var textEl = btn.querySelector('.fav-text');

        btn.setAttribute('data-fav-state', state);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');

        if (state === 'pending') {
          /* 处理中：禁用 + aria-busy。disabled 一生效，浏览器就不再派发第二次点击，
             这是「连续操作不出错」的第一道闸。 */
          btn.disabled = true;
          btn.setAttribute('aria-busy', 'true');
          if (textEl) textEl.textContent = on ? '取消中…' : '收藏中…';
          btn.setAttribute('aria-label', (on ? '正在取消收藏：' : '正在收藏：') + name);
        } else {
          btn.disabled = false;
          btn.removeAttribute('aria-busy');
          if (iconEl) iconEl.textContent = on ? '★' : '☆';
          if (textEl) textEl.textContent = on ? '已收藏' : '收藏';
          btn.setAttribute('aria-label', (on ? '已收藏，点击取消：' : '收藏：') + name);
        }
      }

      /* ---------- 收藏成功时让星星弹一下 ---------- */
      function popFav(btn) {
        btn.classList.remove('is-pop');
        void btn.offsetWidth;   /* 读一次宽度强制浏览器重排，动画才会被重新触发 */
        btn.classList.add('is-pop');
      }

      /* ---------- 点一下收藏按钮 ---------- */
      function onFavClick(btn) {
        var slug = btn.getAttribute('data-slug') || '';
        var name = btn.getAttribute('data-title') || '这条概念';
        if (!slug) return;

        /* 防重复第二道闸：正在等回包就整段忽略。
           disabled 已经能挡住鼠标和键盘，这一道是兜底 ——
           万一将来换成别的元素、或者 disabled 被绕过，也不会重复提交。 */
        if (inFlight[slug]) return;

        /* 数据层没加载成功时，给一句能照做的提示，而不是静默失灵 */
        if (typeof toggleFavoriteMock !== 'function' || typeof removeFavoriteMock !== 'function') {
          showToast('收藏功能没有加载出来。请确认 concepts.js 与 index.html 在同一个文件夹，'
                  + '然后刷新页面再试。');
          return;
        }

        var willFav = favState[slug] !== true;   // 这次点下去想要的结果
        inFlight[slug] = true;
        paintFav(btn, 'pending');

        /* Day 24 修复（真 Bug：取消收藏是假成功）。
           原来不管想收藏还是想取消，一律调 toggleFavoriteMock（只会 POST），
           取消时 POST 拿到 409 被当成成功 → 界面显示「☆ 收藏」，
           数据库那一行从未被删，刷新后又变回「★ 已收藏」。
           现在按意图分流：取消走 removeFavoriteMock（DELETE /api/favorites/{id}）。
           函数名保持不变，onDone 的参数形状也仍是布尔「是否已收藏」，
           所以下面这几行一个字都不用改。 */
        var action = willFav ? toggleFavoriteMock : removeFavoriteMock;

        action(slug, function onDone(isFav) {
          inFlight[slug] = false;
          favState[slug] = willFav;              // 只有回包成功才落状态
          paintFav(btn, willFav ? 'on' : 'off');
          if (willFav) popFav(btn);
        }, function onError(err) {
          inFlight[slug] = false;
          /* 失败就退回点击前的样子，别让按钮停在一个骗人的状态上 */
          paintFav(btn, favState[slug] === true ? 'on' : 'off');
          /* Day 24：把错误记进 console 再提示。
             原来直接把 err 丢了（Day 23 审计判过的毛病：catch 丢 err）。
             排查「为什么取消失败」时，console 里必须有原始 code。 */
          console.error('[index] ' + (willFav ? '收藏' : '取消收藏') + '失败：', err);
          showToast('没能' + (willFav ? '收藏' : '取消收藏') + '「' + name + '」'
                  + '，请刷新页面后再试一次。');
        });
      }

      /* ---------- 调试开关 1：从地址栏读 ?state=loading / empty / error ----------
         只在验收时用来强制进入加载态、空态、错误态；正常运行不会带这个参数。 */
      var forced = '';
      try {
        var search = (typeof window !== 'undefined' && window.location) ? String(window.location.search) : '';
        var hit = search.match(/(?:^|[?&])state=(loading|empty|error)(?![a-z])/);
        if (hit) forced = hit[1];
      } catch (e) {
        forced = '';
      }

      /* ---------- 调试开关 2：从地址栏读 ?favfail=1 ----------
         让收藏请求一律失败，用来验收「失败提示」那条路径。
         开关本身定义在 concepts.js 第四节；正常访问不会带这个参数。
         例：http://127.0.0.1:8000/?favfail=1 */
      try {
        if (/(?:^|[?&])favfail=1(?![0-9])/.test(String(window.location.search))
            && typeof FAVORITE_FORCE_FAIL !== 'undefined') {
          FAVORITE_FORCE_FAIL = true;
        }
      } catch (e) { /* 读不到地址栏就不开这个开关，不影响正常使用 */ }

      /* ---------- 收藏按钮的点击监听（事件委托） ----------
         只绑一次，绑在最外层的列表容器上。卡片是脚本生成的，
         委托给容器就不必每次重渲染后重新绑，也不会重复绑。 */
      listEl.addEventListener('click', function (e) {
        var target = e.target;
        var btn = (target && target.closest) ? target.closest('.fav-btn') : null;
        if (!btn || !listEl.contains(btn)) return;

        /* 按钮与 <a> 是兄弟节点，点它不会跳转；
           这一行是保险：万一将来有人把按钮挪回 <a> 里面，也不会跳走。 */
        e.preventDefault();
        onFavClick(btn);
      });

      /* ==========================================================================
       * 状态 1 / 4：加载中
       * ========================================================================== */
      function renderLoading() {
        setState('loading');
        countEl.textContent = '';
        listEl.innerHTML = '<div class="panel panel-center" role="status">'
                         +   '<span class="spinner" aria-hidden="true"></span>'
                         +   '<p class="panel-desc">正在加载内容…</p>'
                         + '</div>';
      }

      /* ==========================================================================
       * 状态 2 / 4：成功 —— 计数行 + 概念卡片列表
       * PRD.md §3 F1：每条显示 日期 · 中文名 · 英文名 · 一句话定义
       * ========================================================================== */
      function renderSuccess(list) {
        setState('success');

        /* 已收录条数 = 只统计「写完了」的记录（PRD.md §6.1）
           Day 20 起列表来自公网接口，接口直接给了 isComplete（数据库的完整度视图
           算出来的），所以优先用它；没有这个字段时才退回本地的字段检查。 */
        var completeCount = 0;
        for (var i = 0; i < list.length; i++) {
          if (typeof list[i].isComplete === 'boolean') {
            if (list[i].isComplete) completeCount++;
          } else if (isConceptComplete(list[i])) {
            completeCount++;
          }
        }
        var todoCount = list.length - completeCount;

        var countText = '已更新 <strong>' + completeCount + '</strong> 个概念';
        if (todoCount > 0) {
          countText += '（另有 ' + todoCount + ' 条待补充，未计入）';
        }

        /* 最近更新日期：列表已按日期倒序，取第一条有日期的记录即可。
           Day 20 起这份列表来自公网接口，所以这个日期就是数据库里的真实发布日期。 */
        var latest = '';
        for (var k = 0; k < list.length; k++) {
          if (list[k].date) { latest = list[k].date; break; }
        }
        if (latest) countText += ' · 最近更新 ' + esc(latest) + '（数据来自数据库）';

        countEl.innerHTML = countText;

        /* 渲染概念卡片
           Day 11 改动：整张卡片外面多包一层 .item-wrap，收藏按钮放在这一层里、
           与 <a> 平级 —— <a> 里不能再套 <button>（HTML 不允许交互元素嵌套）。
           卡片本身的日期 / 标题 / 定义三行原样不动，收藏按钮用绝对定位
           压回右上角，所以卡片高度、行距、内边距一个像素都没变。 */
        var html = '';
        for (var j = 0; j < list.length; j++) {
          var c = list[j];

          html += '<div class="item-wrap">';
          html += '  <a class="item" href="concept.html?id=' + encodeURIComponent(c.slug) + '">';
          html += '    <div class="item-meta">';
          html += '      <span>' + esc(c.date || '日期待补充') + '</span>';
          /* 「待补充」标签：同样优先用接口给的 isComplete */
          var isTodo = (typeof c.isComplete === 'boolean')
            ? (c.isComplete !== true)
            : (!isConceptComplete(c));
          if (isTodo) html += '      <span class="tag-todo">待补充</span>';
          html += '    </div>';
          html += '    <h2 class="item-title">' + esc(c.titleZh)
                +       '<span class="en">' + esc(c.titleEn) + '</span></h2>';
          html += '    <p class="item-def">' + esc(c.definition) + '</p>';
          html += '  </a>';
          html += '  ' + favButtonHtml(c);
          html += '</div>';
        }
        listEl.innerHTML = html;
      }

      /* ==========================================================================
       * 状态 3 / 4：空 —— 数据文件里一条记录都没有（PRD.md §7 第 3 项）
       * ========================================================================== */
      function renderEmpty() {
        setState('empty');
        countEl.textContent = '已更新 0 个概念';
        listEl.innerHTML = panel(
          '内容准备中',
          '数据库里还没有写入任何概念。往 <code>concepts</code> 表里加一条，刷新后它会自动出现在这里。'
        );
      }

      /* ==========================================================================
       * 状态 4 / 4：错误 —— 数据没能取回来（PRD.md §7 第 5 项）
       * Day 20 起数据来自公网接口，所以失败原因不再是「文件没放一起」，
       * 而可能是：断网 / 跨域被拦 / 接口异常。文案已按真实原因改写。
       * 用 typeof 判断是安全的：即使取数函数根本不存在，也不会抛错。
       *
       * Day 23 改：原先三类错误共用一句话（实测发现：后端表名写错返回 500 时，
       * 页面却说「没能连上数据接口…跨域白名单」——服务端故障被误报成用户网络问题，
       * 会让人白等 1-2 分钟）。现按 err.code 分场景给不同中文提示。
       * ========================================================================== */
      function renderError(err) {
        setState('error');
        countEl.textContent = '';

        /* 三类口径与console.html 的 presentError 一致：
             网络/接口错 → 提示稍后再试；服务端错 → 通用提示 + 日志，不说细节。 */
        var code = (err && err.code) || '';
        var title, body;

        if (code === 'INTERNAL_ERROR') {
          title = '内容没能加载出来';
          body = '页面出了点问题，稍后再试。这是我们这边的问题，已经记下日志了。';
          console.error('[index] 服务端错误 code=' + code, err);
        } else if (code === 'DB_UNAVAILABLE') {
          title = '内容暂时打不开';
          body = '内容服务暂时不可用，请稍后再刷新页面。不需要改你填的任何内容。';
          console.warn('[index] 内容服务不可用', err);
        } else if (code === 'NETWORK_ERROR') {
          title = '内容没能加载出来';
          body = '网络连不上，没能取到内容。请检查网络后刷新页面再试。';
          console.warn('[index] 网络层失败', err);
        } else {
          /* 未知码 / 没给code：保守按网络错说，不提跨域白名单等内部排查话术 */
          title = '内容没能加载出来';
          body = '没能取到内容，请稍后刷新页面再试。';
          console.warn('[index] 取数失败，未知错误码：', code, err);
        }

        listEl.innerHTML = panel(title, body);
      }

      /* ==========================================================================
       * 主流程：先进入「加载中」，取数回来后再切到另外三种状态之一
       * --------------------------------------------------------------------------
       * 取数走 fetchConceptList()（见 concepts.js 第三节）。
       * Day 20 起它是真的在调公网接口 GET /api/concepts，
       * 所以「加载中」是真实的网络等待，不是假装的。
       * 因为这层函数名与回调形状从 Day 8 保持至今，这一段从Day 8 到今天一行都没改过。
       * ========================================================================== */
      renderLoading();

      /* 异常：数据文件没加载成功 —— 连取数函数都不存在（PRD.md §7 第 5 项） */
      if (typeof fetchConceptList !== 'function') {
        renderError();
        return;
      }

      /* 调试开关优先：?state=loading 就停在加载态，不再往下取数。
         用的是上面同一个 renderLoading()，所以画面与真实加载态完全一致 ——
         不是另造一个「看起来像加载」的假状态。
         位置放在「数据文件没加载成功」的检查之后：那种情况属于真出错，
         该显示错误态，不该被定格在加载中。 */
      if (forced === 'loading') { return; }

      /* 异步取数：等待期间页面停在「加载中」 */
      fetchConceptList(function (list) {

        /* 调试开关优先：让空态、错误态也能被肉眼验收 */
        if (forced === 'error') { renderError({ code: 'INTERNAL_ERROR' }); return; }
        if (forced === 'empty') { renderEmpty(); return; }

        /* 异常：一条内容都没有（PRD.md §7 第 3 项） */
        if (!list || list.length === 0) {
          renderEmpty();
          return;
        }

        /* 正常 */
        renderSuccess(list);

        /* Day 20 新增：列表渲染完后，把数据库里已收藏的 slug 读回来，
           填进 favState 并重画按钮 —— 这样刷新页面不会「忘记」收藏。
           这是只读的补充动作，失败也不影响上面的列表，所以不接错误回调。 */
        if (typeof fetchFavoriteSlugs === 'function') {
          fetchFavoriteSlugs(function (slugs) {
            if (!slugs || !slugs.length) return;
            for (var n = 0; n < slugs.length; n++) favState[slugs[n]] = true;
            /* 重画所有收藏按钮，让已收藏的显示成实心。

               Day 24修复：原来这里对**所有**按钮无差别传 'on'，
               于是未收藏的卡片也拿到 data-fav-state="on"（蓝底实心星），
               而 paintFav 内部的文字仍按 favState 判成「收藏」——
               按钮外观自相矛盾，且视觉上骗人。
               改成逐个按自己的真实状态重画：已收藏 'on'，其余 'off'。 */
            var btns = listEl.querySelectorAll('.fav-btn');
            for (var b = 0; b < btns.length; b++) {
              var bs = btns[b].getAttribute('data-slug') || '';
              paintFav(btns[b], favState[bs] === true ? 'on' : 'off');
            }
          });
        }
      }, function onListFail(err) {
        /* Day 23 改：把错误对象传下去，让 renderError 按 code 分场景提示
           （原先三类共用一句话，服务端500 会被误报成网络问题）。 */
        renderError(err);
      });
    })();
  </script>
</body>
</html>
